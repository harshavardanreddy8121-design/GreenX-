spring:
  application:
    name: farm-management-api
    # DB connection is configured via environment variables:
    #   SPRING_DATASOURCE_URL      e.g. jdbc:postgresql://host:5432/dbname
    #   SPRING_DATASOURCE_USERNAME
    #   SPRING_DATASOURCE_PASSWORD
  
  # PostgreSQL Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:greenx}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Railway Postgres free tier allows max 20 connections total across all apps.
      # Keep pool small to stay within limits.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
  
  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  
  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

  # File Upload configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

# Logging Configuration
logging:
  level:
    root: INFO
    com.greenx: INFO
    # Raise AiService to DEBUG so rule-based fallback decisions are visible in logs
    com.greenx.farmapi.service.AiService: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Server Configuration
# Railway injects PORT automatically; default 8001 matches Emergent's expected port
server.port: ${PORT:8001}
server.servlet.context-path: /api

# JWT Configuration
# Set JWT_SECRET env var in Railway/Render to a strong random string
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-at-least-32-characters-long!}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours default

# File upload directory
app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

# OpenAI / Generative AI Configuration
# ─────────────────────────────────────────────────────────────────────────────
# To enable GPT-4, set OPENAI_API_KEY in Railway → Service → Variables.
# The value must be a valid sk-... key from https://platform.openai.com/api-keys
#
# Without a key the service falls back to the deterministic rule-based engine
# and every response will include "modelUsed": "rule-based".
#
# Verify the key was picked up after deploy by calling GET /api/ai/status —
# the response will show "openAiConfigured": true and "apiKeyStatus": "sk-proj****"
# when the key is correctly injected.
# ─────────────────────────────────────────────────────────────────────────────
openai:
  # Primary resolution: OPENAI_API_KEY env var (set in Railway Variables panel)
  api-key: ${OPENAI_API_KEY:}
  # Model to use — override with AI_MODEL env var if needed.
  # Default is gpt-4o (latest, widely available). Falls back to gpt-3.5-turbo automatically.
  model: ${AI_MODEL:gpt-4o}
  # Sampling temperature: 0.0 = deterministic, 1.0 = creative
  temperature: ${AI_TEMPERATURE:0.7}
  # Maximum tokens per response
  max-tokens: ${AI_MAX_TOKENS:2000}

# Weather API Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Set WEATHER_API_KEY in Railway → Service → Variables to enable live weather.
# Get a free key at https://www.weatherapi.com/
# Without a key the WeatherController returns an empty list gracefully.
# ─────────────────────────────────────────────────────────────────────────────
weather:
  api:
    key: ${WEATHER_API_KEY:}
    url: ${WEATHER_API_URL:https://api.weatherapi.com/v1}

# CORS Configuration
# Override at runtime by setting the ALLOWED_ORIGINS environment variable
# (comma-separated list of origins) in Railway / Render / Vercel.
# The cors.allowed-origins key below is the Spring-property fallback; the
# SecurityConfig also accepts the bare ALLOWED_ORIGINS env var directly.
cors:
  allowed-origins: >-
    ${ALLOWED_ORIGINS:
    http://localhost:3000,
    http://localhost:5173,
    http://localhost:8080,
    https://greenx.vercel.app,
    https://mygreenx.vercel.app,
    https://greenx-1.onrender.com,
    https://spring-boot-backend-production-13e6.up.railway.app}

